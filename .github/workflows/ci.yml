name: CI Build & Test

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build:
    name: Build and Test Solution
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore HIS.sln

      - name: Build solution
        run: dotnet build HIS.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/HIS.Tests/HIS.Tests.csproj --configuration Release --no-build --verbosity normal
